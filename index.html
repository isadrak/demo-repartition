<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isaac · Répartition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan : techniciens en lignes, heures en colonnes. Toute l'équipe et toute la journée sur un écran.
   Une seule couleur porte un sens : l'état de l'appel. Le reste est neutre. */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--sunken:#F7F8FA;--ink:#0F1217;--ink-2:#3B414C;--muted:#69707D;
  --line:#E4E6EA;--line-2:#EFF0F3;
  --accent:#2F55E8;--accent-weak:#EEF2FE;--accent-line:#D3DCFC;
  --ok:#11845A;--ok-weak:#E8F6EF;--danger:#D23838;--danger-weak:#FDECEC;--warn:#B7791F;
  --done:#F0F1F3;--done-ink:#8A909B;
  --hatch:rgba(15,18,23,.05);
  --shadow:0 1px 2px rgba(15,18,23,.05);
  --pop:0 12px 32px -8px rgba(15,18,23,.22),0 2px 6px rgba(15,18,23,.06);
  --font:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E12;--surface:#14171C;--sunken:#181B21;--ink:#ECEEF2;--ink-2:#C3C8D1;--muted:#8D94A1;
    --line:#262A31;--line-2:#1E2228;--accent:#7591FF;--accent-weak:#1A2140;--accent-line:#2D3A6B;
    --ok:#3CC488;--ok-weak:#122A20;--danger:#FF6B6B;--danger-weak:#3A1A1A;--done:#1C1F25;--done-ink:#6E7581;
    --hatch:rgba(255,255,255,.04);--shadow:0 1px 2px rgba(0,0,0,.4);--pop:0 16px 40px -8px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E12;--surface:#14171C;--sunken:#181B21;--ink:#ECEEF2;--ink-2:#C3C8D1;--muted:#8D94A1;
  --line:#262A31;--line-2:#1E2228;--accent:#7591FF;--accent-weak:#1A2140;--accent-line:#2D3A6B;
  --ok:#3CC488;--ok-weak:#122A20;--danger:#FF6B6B;--danger-weak:#3A1A1A;--done:#1C1F25;--done-ink:#6E7581;
  --hatch:rgba(255,255,255,.04);--shadow:0 1px 2px rgba(0,0,0,.4);--pop:0 16px 40px -8px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:60px 1fr;height:100%}
/* Rail de navigation */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{position:relative;display:flex;align-items:flex-end;margin:2px 0 16px;user-select:none}
.logo span{font-size:16px;font-weight:800;letter-spacing:-.045em;line-height:1;background:linear-gradient(135deg,#1FB6FF 0%,#3D5AFE 55%,#7C5CDB 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{width:4px;height:4px;border-radius:50%;background:#1FB6FF;margin:0 0 2px 1px;flex:none}
.rail button{width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;position:relative}
.rail button:hover{background:var(--sunken);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--accent-weak);color:var(--accent)}
.rail button[disabled]{opacity:.35;cursor:default}
.rail button .tip{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:50}
.rail button:hover .tip{opacity:1}
.rail .sp{flex:1}
.proto{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* Barre d'outils */
.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.nav-date{display:flex;align-items:center;gap:2px}
.ibtn{width:32px;height:32px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink-2);display:grid;place-items:center}
.ibtn:hover{background:var(--sunken);border-color:var(--line)}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}
.btn .n{font-size:11.5px;font-weight:700;background:var(--danger);color:#fff;border-radius:999px;padding:0 6px;line-height:18px}
.btn[aria-pressed="true"] .n{background:var(--accent);color:#fff}
.title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 6px 0 8px;white-space:nowrap}
.title span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;height:26px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.grow{flex:1}
.search{position:relative;width:260px}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);padding:0 10px 0 32px;outline:none;font-size:13px}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Ligne de résumé */
.sum{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.chips{display:flex;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip b{font-weight:700;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] b{color:var(--surface)}
.stats{display:flex;gap:16px;margin-left:auto;align-items:center}
.stats span b{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Corps */
.body{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;position:relative}

/* Vue jour : timeline horizontale */
.tl{position:relative;min-width:900px}
.tl-head{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:1px solid var(--line);height:34px}
.tl-head .rh{width:var(--rail);flex:none;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 16px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tl-head .hours{position:relative;flex:1}
.hr-lbl{position:absolute;top:10px;font-size:11.5px;color:var(--muted);transform:translateX(-50%)}
.row{display:flex;height:var(--rowh);border-bottom:1px solid var(--line-2);background:var(--surface)}
.row:hover .who{background:var(--sunken)}
.who{width:var(--rail);flex:none;border-right:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;position:sticky;left:0;z-index:4;background:var(--surface)}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--c)}
.who .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.who .st.free{color:var(--ok);font-weight:600}
.who .st.none{color:var(--muted)}
.who .cap{height:3px;width:56px;border-radius:2px;background:var(--line-2);overflow:hidden;flex:none}
.who .cap i{display:block;height:100%;background:var(--ink-2);border-radius:2px}
.who .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.track{position:relative;flex:1}
.offh{position:absolute;top:0;bottom:0;background:var(--sunken)}
.hl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.track.drop{background:var(--accent-weak)}
.track .abs{position:absolute;top:8px;bottom:8px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border:1px dashed var(--line);display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--muted);gap:6px;overflow:hidden;white-space:nowrap}
.track .abs b{color:var(--ink-2);font-weight:600}
.freeline{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ok);font-weight:600;pointer-events:none}
.job{position:absolute;border-radius:8px;padding:0 9px;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;cursor:grab;user-select:none;touch-action:none;white-space:nowrap;
  background:var(--accent-weak);border:1px solid var(--accent-line);color:var(--ink);transition:box-shadow .12s,opacity .12s}
.job:hover{box-shadow:var(--pop);z-index:3}
.job .l1{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.job .l2{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.job.s-run{background:var(--surface);border:1.5px solid var(--ok)}
.job.s-run .l1::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-weak);flex:none}
.job.s-done{background:var(--done);border-color:var(--line);color:var(--done-ink)}
.job.s-done .l2{color:var(--done-ink)}
.job .ud{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.job.conflict{outline:2px solid var(--danger);outline-offset:-1px}
.job.half .l2{display:none}
.job.narrow .l2{display:none}
.job.narrow{padding:0 6px}
.job.dim{opacity:.18}
.job.hit{outline:2px solid var(--accent);outline-offset:1px}
.job.dragging{z-index:40;cursor:grabbing;box-shadow:var(--pop);opacity:.95}
.job .rs{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.job:hover .rs::after{content:"";position:absolute;right:2px;top:30%;bottom:30%;width:2px;border-radius:1px;background:var(--muted);opacity:.5}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.9;pointer-events:none}
.now-lbl{position:absolute;top:7px;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;z-index:7}
.ph{position:absolute;border-radius:8px;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:11.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;padding:0 8px;pointer-events:none;z-index:8;white-space:nowrap;overflow:hidden}

/* Panneau à céduler */
.drawer-l{width:320px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.drawer-l[hidden]{display:none}
.dl-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dl-h h2{font-size:14px;font-weight:700;margin:0}
.dl-h .c{font-size:12px;color:var(--muted)}
.dl-h select{margin-left:auto;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12px;padding:0 6px}
.dl-list{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.q{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:3px;cursor:grab;user-select:none;touch-action:none;background:var(--surface)}
.q:hover{border-color:var(--muted)}
.q .r1{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.q .r1 .d{margin-left:auto}
.q .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .p{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.tag.u{background:var(--danger-weak);color:var(--danger);border-color:transparent}
.tag.w{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.tag.ok{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.dl-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.q.ghost{position:fixed;z-index:200;pointer-events:none;width:260px;box-shadow:var(--pop);transform:rotate(-1.5deg)}

/* Vue semaine */
.wk{display:grid;min-width:900px}
.wk .hd{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.wk .hd b{color:var(--ink);font-size:13px}
.wk .hd.today b{color:var(--accent)}
.wk .hd.c0{position:sticky;left:0;z-index:6;border-right:1px solid var(--line)}
.wk .who{position:sticky;left:0;height:auto;padding:10px 14px 10px 16px;border-bottom:1px solid var(--line-2)}
.wc{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:64px}
.wc:hover{background:var(--sunken)}
.wc.drop{background:var(--accent-weak);box-shadow:inset 0 0 0 1.5px var(--accent)}
.wc .bar2{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.wc .bar2 i{display:block;height:100%;background:var(--ink-2);border-radius:3px}
.wc .bar2 i.full{background:var(--muted)}
.wc .info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.wc .info .f{color:var(--ok);font-weight:600}
.wc.abs2{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,var(--surface) 6px 12px);cursor:default;font-size:12px;color:var(--muted);justify-content:center}
.wc .dots{display:flex;gap:3px;flex-wrap:wrap}
.wc .dots i{width:8px;height:8px;border-radius:2px;background:var(--accent-line)}
.wc .dots i.d{background:var(--line)}
.wc .dots i.u{background:var(--danger)}

/* Vue mois */
.mo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(150px,1fr);gap:1px;background:var(--line);min-height:100%;border-bottom:1px solid var(--line)}
.mo .mh{background:var(--surface);padding:8px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.md{background:var(--surface);border:0;text-align:left;padding:9px 11px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;overflow:hidden}
.md:hover{background:var(--sunken)}
.md.out{opacity:.45}
.md .n{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.md.today .n span:first-child{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px}
.md .n small{font-size:11.5px;color:var(--muted);font-weight:500}
.md .bar2{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.md .bar2 i{display:block;height:100%;border-radius:3px}
.md .ft{font-size:12px;color:var(--muted);margin-top:auto}
.md .ft b{color:var(--ok)}


/* Semaine en calendrier (façon Outlook) */
.wcal{display:flex;flex-direction:column;min-width:900px;min-height:100%}
.wc-h{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:6}
.wc-h .dh{padding:8px 10px;border-left:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);cursor:pointer}
.wc-h .dh:hover{background:var(--sunken)}
.wc-h .dh b{font-size:13px;color:var(--ink)}
.wc-h .dh.today b{color:var(--accent)}
.wc-b{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));background:var(--surface)}
.gut{position:relative}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.dcol{position:relative;border-left:1px solid var(--line-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% var(--ph);background-position:0 0}
.dcol.drop{background-color:var(--accent-weak)}
.offh2{position:absolute;left:0;right:0;background:var(--sunken)}
.nowl2{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2;pointer-events:none}
.absb{position:absolute;left:3px;right:3px;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border:1px dashed var(--line);border-radius:6px;font-size:11.5px;color:var(--muted);padding:4px 6px}
.ev{position:absolute;border-radius:6px;padding:3px 6px;overflow:hidden;font-size:11.5px;line-height:1.3;cursor:grab;user-select:none;touch-action:none;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 36%,var(--surface));color:var(--ink);transition:box-shadow .12s}
.ev b{color:color-mix(in srgb,var(--c) 78%,var(--ink));font-weight:700;margin-right:4px}
.ev .t2{display:block;color:var(--muted);font-size:11px}
.ev.s-done{background:var(--done);border-color:var(--line);color:var(--done-ink)}
.ev.s-done b,.ev.s-done .t2{color:var(--done-ink)}
.ev.s-run{background:var(--surface);border:1.5px solid var(--ok)}
.ev .ud{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-right:4px;vertical-align:1px}
.ev:hover{box-shadow:var(--pop);z-index:3}
.ev.dim{opacity:.18}
.ev.dragging{z-index:40;box-shadow:var(--pop);cursor:grabbing}
.ev .rsb{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize}
.tchips{display:flex;gap:4px;flex-wrap:wrap}
.tchip{height:26px;padding:0 9px 0 3px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tchip .av{width:20px;height:20px;font-size:8.5px}
.tchip[aria-pressed="false"]{opacity:.42}
.tchip:hover{opacity:1}
.md .ev2{font-size:11.5px;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;color:var(--ink-2)}
.md .ev2 i{width:7px;height:7px;border-radius:2px;flex:none;background:var(--c)}
.md .ev2.d{color:var(--done-ink)}
.md .ev2 span{overflow:hidden;text-overflow:ellipsis}
.md .more{font-size:11.5px;color:var(--muted);font-weight:600}

.dh{flex-wrap:wrap;row-gap:6px}
.lh{flex-basis:calc(100% + 20px);margin:0 -10px -8px;display:flex;border-top:1px solid var(--line-2)}
.lh span{flex:1;min-width:0;text-align:center;font-size:10px;font-weight:700;color:var(--c);padding:3px 0;overflow:hidden}
.lane{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 2.5%,transparent);pointer-events:none}
.wcal.nar .ev{padding:3px 0;text-align:center;font-size:10.5px}
.wcal.nar .ev b{margin:0}
.wcal.nar .ev .ud{position:absolute;top:3px;right:3px;margin:0}
.ev.conflict{box-shadow:inset 0 0 0 1.5px var(--danger)}
.wcal.focus .ev:not(.hlon){opacity:.22}
.wcal.focus .lh span:not(.hlon){opacity:.3}

/* Route entre deux appels */
.drv{position:absolute;transform:translate(-50%,-50%);height:18px;padding:0 6px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;z-index:1;pointer-events:auto;cursor:default}

/* Suggestions */
.sg{position:absolute;border-radius:8px;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));z-index:6;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;animation:sgIn .25s ease}

.sg small{font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.wcal .sg{padding:2px 0;justify-content:center;align-items:flex-start}
@keyframes sgIn{from{opacity:0;transform:scale(.97)}to{opacity:1}}
.q.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);cursor:default}
.sugs{display:grid;gap:5px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line-2)}
.sugs .lb{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.sugs .lb svg{color:var(--accent)}
.sug{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 7px;border-radius:8px;border:1px solid var(--line-2);background:var(--sunken);text-align:left;width:100%;color:var(--ink);cursor:pointer}

.sug .av{width:22px;height:22px;font-size:8.5px}
.sug b{font-size:12.5px;display:block}
.sug div span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug i{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--accent-line);border-radius:6px;padding:2px 7px}

.qact{display:flex;gap:6px;margin-top:2px}

/* Toast avec annuler */
.toast{display:flex;align-items:center;gap:14px}

/* Carte */
.mapp{width:380px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}

.mapw .sgl{fill:none;stroke-width:1.8;stroke-dasharray:4 3}

.mlist{overflow:auto;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.mlist h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 4px}
.ml{display:grid;grid-template-columns:24px 1fr auto 28px;gap:9px;align-items:center;padding:6px 6px;border-radius:9px}
.ml:hover{background:var(--sunken)}
.ml .av{width:24px;height:24px;font-size:9px}

.tc.nq{opacity:.45}

.team{padding:16px 20px 24px;display:grid;gap:8px;align-content:start}

.em-h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}

.em .ld b{color:var(--ink);font-weight:650}
.cst{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ok)}

.cst.warn{color:#B7791F}.cst.bad{color:var(--danger)}
.em .chev{color:var(--muted)}
.sec{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line-2)}
.sec:first-child{border-top:0;padding-top:0}
.sec h4{margin:0;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.emhead{display:flex;gap:14px;align-items:center}
.emhead .av{width:52px;height:52px;font-size:17px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.tg2{display:flex;gap:6px;flex-wrap:wrap}
.tg2 button{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tg2 button[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}

.tg2.days button[aria-pressed="true"]::before{display:none}
.lst{display:grid;gap:6px}
.lr{display:grid;grid-template-columns:1fr auto 28px;gap:8px;align-items:center;padding:7px 8px 7px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--sunken);font-size:12.5px}
.lr.cert{grid-template-columns:1fr 128px auto 28px}
.lr .in{height:30px;font-size:12.5px}
.lr small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.lr .x{width:28px;height:28px;border:0;background:none;border-radius:7px;color:var(--muted);display:grid;place-items:center;cursor:pointer}

.addl{justify-self:start;border:1px dashed var(--line);background:none;border-radius:8px;height:30px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}

.abform{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:end}
.abform .in{height:32px;font-size:12.5px}
.sw2{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.sw2 small{display:block;color:var(--muted);font-size:12px}
.tog{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog[aria-pressed="true"]{background:var(--ok)}
.tog[aria-pressed="true"]::after{transform:translateX(16px)}
.warnbox{font-size:12.5px;color:#8A5A12;background:#FFF6E5;border:1px solid #F3DDB0;border-radius:9px;padding:8px 10px}
/* Filtres des appels */
.fbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fb{height:28px;padding:0 10px;border-radius:8px;border:1px dashed var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.fb:hover{border-color:var(--muted)}
.fb[aria-pressed="true"]{border-style:solid;border-color:var(--accent-line);background:var(--accent-weak);color:var(--accent)}
.fb svg{opacity:.6}
.fclr{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 6px}

.pop{position:fixed;z-index:160;min-width:230px;max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:6px;display:none}
.pop.on{display:block}
.pop h5{margin:4px 8px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.po{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;font-size:13px;text-align:left;color:var(--ink);cursor:pointer}
.po:hover{background:var(--sunken)}

.po .dt{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;background:var(--c)}

.qs{margin-left:auto;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--accent-line);background:var(--accent-weak);color:var(--accent);font-size:11px;font-weight:700;cursor:pointer}

.kcol .q .r1 .d{margin-left:auto}
.kcol .q .r1 .d+.qs{margin-left:6px}
td .qs{margin:0}
.dsug{display:grid;gap:6px;padding:12px;border-radius:12px;background:linear-gradient(180deg,var(--accent-weak),transparent);border:1px solid var(--accent-line)}
.dsug .lb{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;display:flex;gap:5px;align-items:center}
.kempty{font-size:12px;color:var(--muted);padding:8px 4px}

.list{padding:0}

td{padding:10px 16px;border-bottom:1px solid var(--line-2);font-size:13px;white-space:nowrap}
td.desc{white-space:normal;color:var(--muted);max-width:420px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunken)}
.kb{display:flex;gap:10px;padding:14px 20px;align-items:flex-start;min-height:100%}
.kcol{flex:0 0 280px;background:var(--sunken);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 160px)}

.kcol h3 i{width:8px;height:8px;border-radius:2px;background:var(--tc)}
.kcol h3 span{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.kcol .b{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.kcol .q{cursor:pointer}

/* Info-bulle et tiroir */
.tip2{position:fixed;z-index:150;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:12px;display:grid;gap:6px;pointer-events:none;opacity:0;transition:opacity .1s}
.tip2.on{opacity:1}
.tip2 .h{font-weight:700;font-size:13.5px}
.tip2 .m{font-size:12px;color:var(--muted)}
.tip2 .p{font-size:12.5px;color:var(--ink-2)}
.tip2 .r{display:flex;gap:6px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.32);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:100;box-shadow:var(--pop);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.dr-h{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dr-h h3{margin:2px 0 0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.dr-h .m{font-size:12px;color:var(--muted)}
.dr-b{padding:16px 20px;overflow:auto;display:grid;gap:14px;flex:1;align-content:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:5px}
.field label,.fl{font-size:12px;font-weight:600;color:var(--muted)}
.in{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);outline:none;width:100%}
textarea.in{height:auto;min-height:84px;padding:8px 10px;resize:vertical}
.in:focus{border-color:var(--accent)}
.techs{display:flex;flex-wrap:wrap;gap:5px}
.tc{height:30px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500}
.tc .av{width:22px;height:22px;font-size:9px;opacity:.5}
.tc small{color:var(--muted);font-size:11px}
.tc[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}
.tc[aria-pressed="true"] .av{opacity:1}
.tc.abs{opacity:.45}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12px;font-weight:600}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.calc{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;background:var(--sunken);font-size:13px}
.calc b{font-size:14px}
.calc .w{margin-left:auto;color:var(--danger);font-weight:600;font-size:12px}
.hist{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.hist div{display:flex;gap:10px;font-size:12.5px}
.hist span{color:var(--muted);width:72px;flex:none}
.dr-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn.ghost{border-color:transparent;color:var(--danger)}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--pop);opacity:0;transition:all .2s;z-index:300;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.weekend{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:60px}
.weekend b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}
@media (max-width:1100px){.drawer-l{width:280px}.search{width:180px}.legend{display:none}}
@media (max-width:820px){.app{grid-template-columns:1fr}.rail{display:none}.drawer-l{display:none}.search{display:none}.stats{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function bestSlot(t,k,c,di){
 if(k<TODAY)return null;
 const ab=absOf(t.id,k);if(ab.some(a=>a.end-a.start>=DAY_END-DAY_START))return null;
 const cs=dayCalls(k).filter(x=>x.techs.includes(t.id)&&x.id!==c.id).sort((a,b)=>a.start-b.start);
 const tw=T[t.id];let min=tw.ws;if(k===TODAY)min=Math.max(tw.ws,Math.ceil((NOWMIN+30)/SLOT)*SLOT);
 const load=cs.reduce((a,x)=>a+x.dur,0)/60;let best=null;
 for(let s=min;s+c.dur<=tw.we;s+=SLOT){
  if(cs.some(x=>s<x.start+x.dur&&s+c.dur>x.start)||ab.some(a=>s<a.end&&s+c.dur>a.start))continue;
  const prev=cs.filter(x=>x.start+x.dur<=s).pop(),next=cs.find(x=>x.start>=s+c.dur);
  const dIn=prev?drv(prev.town,c.town):0,dOut=next?drv(c.town,next.town):0;
  if(S.drvOn){if(prev&&s<prev.start+prev.dur+dIn)continue;if(next&&s+c.dur+dOut>next.start)continue}
  const added=dIn+dOut-(prev&&next?drv(prev.town,next.town):0);
  const score=added+(s-min)/(c.urgent?3:25)+di*(c.urgent?300:40)+load*2+(tw.zone!=="all"&&zoneOf(c.town)!==tw.zone?25:0);
  if(!best||score<best.score)best={t:t.id,k,s,dIn,dOut,added,score,prev,next};
 }
 return best;
}
function next5(){const a=[];let k=TODAY;while(a.length<5){if(!isWE(k))a.push(k);k=addDays(k,1)}return a}
function suggest(c,keys){
 keys=keys||(S.view==="day"?[S.date]:S.view==="week"?rangeKeys().filter(k=>k>=TODAY):next5());
 const out=[];TECHS.forEach(t=>{if(!can(t.id,c.type))return;let b=null;keys.forEach((k,i)=>{const x=bestSlot(t,k,c,i);if(x&&(!b||x.score<b.score))b=x});if(b)out.push(b)});
 return out.sort((a,b)=>a.score-b.score).slice(0,3);
}
function why(x,c){
 const near=p=>p&&(p.town===c.town||drv(p.town,c.town)<=30);
 if(x.prev&&x.prev.town===c.town)return "Déjà à "+c.town;
 if(x.next&&x.next.town===c.town)return "Déjà à "+c.town+" ensuite";
 if(near(x.prev)||near(x.next))return "Déjà dans le secteur ("+(near(x.prev)?x.prev:x.next).town+")";
 const tz=T[x.t].zone;if(!x.prev&&!x.next)return tz!=="all"&&tz===zoneOf(c.town)?"Journée libre, travaille dans ce secteur":"Journée libre";
 return S.drvOn&&x.prev?dmin(x.dIn)+" de route depuis "+x.prev.town:"Se déplace depuis "+(x.prev||x.next).town;
}

/* Optimiser la tournée d'un technicien */
function optimize(tid,k){
 const all=dayRoute(tid,k),mov=all.filter(c=>c.status!=="complete"&&!isRun(c)&&c.techs.length===1&&!(k===TODAY&&c.start<NOWMIN));
 const nm=T[tid].name.split(" ")[0];
 if(mov.length<3){toast("Pas assez d'appels à réordonner pour "+nm);return}
 const fixed=all.filter(c=>!mov.includes(c)),before=routeMin(all),t0=Math.min(...mov.map(c=>c.start));
 const lastFixed=fixed.filter(c=>c.start<t0).pop();
 const left=[...mov],order=[];let town;
 if(lastFixed)town=lastFixed.town;else{const f=mov.reduce((a,b)=>a.start<=b.start?a:b);order.push(left.splice(left.indexOf(f),1)[0]);town=f.town}
 while(left.length){left.sort((a,b)=>drv(town,a.town)-drv(town,b.town));const n=left.shift();order.push(n);town=n.town}
 const plan=[],ab=absOf(tid,k);let t=t0,prev=lastFixed?lastFixed.town:null;
 for(const c of order){let s=plan.length||lastFixed?Math.ceil((t+(prev?drv(prev,c.town):0))/SLOT)*SLOT:t0;
  const a=ab.find(a=>s<a.end&&s+c.dur>a.start);if(a)s=Math.ceil(a.end/SLOT)*SLOT;
  if(s+c.dur>DAY_END||fixed.some(f=>s<f.start+f.dur&&s+c.dur>f.start)){toast("Impossible de réordonner la tournée de "+nm+" sans créer de conflit");return}
  plan.push([c,s]);t=s+c.dur;prev=c.town}
 const after=routeMin([...fixed,...plan.map(([c,s])=>({start:s,town:c.town}))].sort((a,b)=>a.start-b.start));
 if(after>=before){toast("La tournée de "+nm+" est déjà la plus courte");return}
 remember();plan.forEach(([c,s])=>c.start=s);render();toast("Tournée de "+nm+" regroupée par secteur, environ "+dmin(before-after)+" de route en moins",true);
}

let PM=1,WLANES=[];

function layoutDay(list){
 list.sort((a,b)=>a.start-b.start||b.dur-a.dur);
 let cluster=[],end=-1;const out=[];
 const flush=()=>{const lanes=[];cluster.forEach(c=>{let l=0;while(lanes[l]!=null&&lanes[l]>c.start)l++;lanes[l]=c.start+c.dur;c._l=l});cluster.forEach(c=>{c._n=lanes.length;out.push(c)});cluster=[]};
 list.forEach(c=>{if(cluster.length&&c.start>=end){flush();end=-1}cluster.push(c);end=Math.max(end,c.start+c.dur)});
 flush();return out;
}

function applyF(c,skip){const F=S.f;
 if(skip!=="st"&&F.st.size&&!F.st.has(stOf(c)))return false;
 if(skip!=="ty"&&F.ty.size&&!F.ty.has(c.type))return false;
 if(skip!=="te"&&F.te.size&&!(c.techs.length?c.techs.some(t=>F.te.has(t)):F.te.has("none")))return false;
 if(skip!=="tw"&&F.tw.size&&!F.tw.has(c.town))return false;
 if(skip!=="src"&&F.src.size&&!F.src.has(c.source||"tel"))return false;
 if(F.urg&&!(c.urgent&&c.status!=="complete"))return false;
 if(skip!=="per"&&F.per!=="all"){const d=c.date;
  if(F.per==="nodate"){if(d)return false}else if(!d)return false;
  else if(F.per==="today"&&d!==TODAY)return false;
  else if(F.per==="n7"&&(d<TODAY||d>addDays(TODAY,7)))return false;
  else if(F.per==="n30"&&(d<TODAY||d>addDays(TODAY,30)))return false;
  else if(F.per==="p7"&&(d>TODAY||d<addDays(TODAY,-7)))return false}
 return true}

 if(!drag.moved){drag.moved=true;if(drag.kind==="float"){const g=drag.el.cloneNode(true);g.classList.add("ghost");document.body.appendChild(g);drag.g=g;drag.el.style.opacity=".35"}else drag.el.classList.add("dragging")}
 document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
 if(drag.kind==="resize"){const r=drag.el.getBoundingClientRect();let dur=Math.max(SLOT,snap((e.clientX-r.left)/PXM));dur=Math.min(dur,DAY_END-drag.c.start);drag.dur=dur;drag.el.style.width=(dur*PXM-2)+"px";drag.el.querySelector(".l2").textContent=hm(drag.c.start)+"–"+hm(drag.c.start+dur);return}
 if(drag.kind==="evres"){const r=drag.el.getBoundingClientRect();let dur=Math.max(SLOT,snap((e.clientY-r.top)/PM));dur=Math.min(dur,DAY_END-drag.c.start);drag.dur=dur;drag.el.style.height=(dur*PM-2)+"px";return}
 if(drag.kind==="evmove"){const el=document.elementFromPoint(e.clientX,e.clientY),col=(el&&el.closest(".dcol"))||drag.el.parentElement;const cr=col.getBoundingClientRect();col.classList.add("drop");
  let s=DAY_START+snap((e.clientY-cr.top-drag.gy)/PM);s=Math.max(DAY_START,Math.min(DAY_END-drag.c.dur,s));drag.start=s;drag.date=col.dataset.date;
  drag.el.style.transform="translate("+(cr.left-drag.col0.left)+"px,"+((s-drag.c.start)*PM)+"px)";return}
 if(drag.kind==="move"){const tr=trackAt(e.clientX,e.clientY)||drag.el.parentElement;const tr0=tr.getBoundingClientRect();tr.classList.add("drop");
  let s=DAY_START+snap((e.clientX-tr0.left-drag.gx)/PXM);s=Math.max(DAY_START,Math.min(DAY_END-drag.c.dur,s));drag.start=s;drag.nt=tr.dataset.tech;
  drag.el.style.transform="translate("+((s-drag.c.start)*PXM)+"px,"+(tr0.top-drag.t0.top)+"px)";drag.el.querySelector(".l2").textContent=hm(s)+"–"+hm(s+drag.c.dur)+" · "+T[drag.nt].name.split(" ")[0];return}
 drag.g.style.left=(e.clientX-24)+"px";drag.g.style.top=(e.clientY-18)+"px";drag.target=null;let ph=document.querySelector(".ph");
 if(S.view==="day"){const tr=trackAt(e.clientX,e.clientY);
  if(tr){tr.classList.add("drop");const r=tr.getBoundingClientRect();let s=DAY_START+snap((e.clientX-r.left-10)/PXM);s=Math.max(DAY_START,Math.min(DAY_END-drag.c.dur,s));drag.target={tech:tr.dataset.tech,date:S.date,start:s};
   if(!ph){ph=document.createElement("div");ph.className="ph"}if(ph.parentElement!==tr)tr.appendChild(ph);ph.style.left=((s-DAY_START)*PXM)+"px";ph.style.width=(drag.c.dur*PXM)+"px";ph.style.top="7px";ph.style.height=(ROWH-15)+"px";ph.textContent=hm(s)+"–"+hm(s+drag.c.dur)}
  else if(ph)ph.remove()}
 else if(S.view==="week"&&S.wmode==="cal"){const el=document.elementFromPoint(e.clientX,e.clientY),col=el&&el.closest(".dcol");
  if(col){col.classList.add("drop");const cr=col.getBoundingClientRect();let s=DAY_START+snap((e.clientY-cr.top-10)/PM);s=Math.max(WS,Math.min(WE-drag.c.dur,s));const li=Math.max(0,Math.min(WLANES.length-1,Math.floor((e.clientX-cr.left)/(cr.width/WLANES.length))));drag.target={date:col.dataset.date,start:s,cal:true,lt:WLANES[li]};
   if(!ph){ph=document.createElement("div");ph.className="ph"}if(ph.parentElement!==col)col.appendChild(ph);{const lw=100/WLANES.length,li=WLANES.indexOf(drag.target.lt);ph.style.left="calc("+(li*lw)+"% + 1px)";ph.style.right="auto";ph.style.width="calc("+lw+"% - 2px)"}ph.style.top=((s-DAY_START)*PM)+"px";ph.style.height=(drag.c.dur*PM)+"px";ph.textContent=hm(s)+"–"+hm(s+drag.c.dur)}
  else if(ph)ph.remove()}
 else if(S.view==="week"){const el=document.elementFromPoint(e.clientX,e.clientY),wc=el&&el.closest(".wc[data-date]");if(wc){wc.classList.add("drop");drag.target={tech:wc.dataset.tech,date:wc.dataset.date}}}
});
window.addEventListener("pointerup",e=>{
 if(!drag)return;const d=drag;drag=null;document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
 if(d.kind==="cell"){if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<5){S.date=d.el.dataset.date||d.el.dataset.k||d.el.dataset.day;S.view="day";render()}return}
 if(!d.moved){if(d.kind==="float"&&(S.view==="day"||S.view==="week")){pickCall(d.c.id);return}if(d.kind!=="resize")openDrawer(d.c);return}
 remember();
 if(d.kind==="resize"){d.c.dur=d.dur;render();toast("Durée "+dfr(d.dur)+", fin à "+hfr(d.c.start+d.dur),true);return}
 if(d.kind==="evres"){d.c.dur=d.dur;render();toast("Durée "+dfr(d.dur)+", fin à "+hfr(d.c.start+d.dur),true);return}
 if(d.kind==="evmove"){const c=d.c,ch=d.start!==c.start||d.date!==c.date;c.start=d.start;c.date=d.date;render();if(ch){const dd=fromKey(c.date);toast(T[c.techs[0]].name.split(" ")[0]+" : "+DAYS[dd.getDay()]+" "+dd.getDate()+", "+hfr(c.start)+" à "+hfr(c.start+c.dur),true)}return}
 if(d.kind==="move"){const c=d.c,ch=d.start!==c.start||d.nt!==d.tech;c.start=d.start;if(d.nt!==d.tech){c.techs=c.techs.filter(x=>x!==d.tech);if(!c.techs.includes(d.nt))c.techs.push(d.nt)}render();if(ch)toast(T[d.nt].name+", "+hfr(c.start)+" à "+hfr(c.start+c.dur),true);return}
 d.g&&d.g.remove();d.el.style.opacity="";const ph=document.querySelector(".ph");if(ph)ph.remove();
 const t=d.target;if(!t)return;const c=d.c;let s=t.start;
 if(t.cal){if(firstFree(t.lt,t.date,c.dur,t.start)!==t.start){toast(T[t.lt].name.split(" ")[0]+" n'est pas libre à "+hfr(t.start));return}t.tech=t.lt}
 if(s==null){s=firstFree(t.tech,t.date,c.dur,null);if(s==null){toast("Pas assez de temps libre pour "+T[t.tech].name.split(" ")[0]);return}}
 c.techs=[t.tech];c.date=t.date;c.start=s;c.status="cedule";render();const dd=fromKey(t.date);toast("Cédulé : "+T[t.tech].name+", "+DAYS[dd.getDay()]+" "+dd.getDate()+" à "+hfr(s),true);
});

/* Tiroir de détail */
let ed=null;
function openDrawer(c){
 const isNew=!c;tip.classList.remove("on");
 ed=isNew?{id:null,client:"",town:"",addr:"",type:"entretien",problem:"",dur:90,requester:"Réception",appliance:"",techs:[],date:isWE(S.date)?addDays(monday(S.date),7):S.date,start:WS,status:"note",urgent:false,source:"tel"}:JSON.parse(JSON.stringify(c));
 if(!ed.date)ed.date=isWE(S.date)?addDays(monday(S.date),7):S.date;if(ed.start==null)ed.start=WS;
 const e=ed,sel=new Set(e.techs);
 const opts=[];for(let m=DAY_START;m<DAY_END;m+=SLOT)opts.push('<option value="'+m+'"'+(m===e.start?" selected":"")+'>'+hfr(m)+'</option>');
 const DS=!isNew&&backlog().includes(c)?suggest(c,next5()):[];
 const past=isNew?[]:S.calls.filter(x=>x.client===e.client&&x.id!==e.id&&x.status==="complete").slice(0,3);
 $("#drawer").innerHTML='<div class="dr-h"><div style="flex:1;min-width:0"><div class="m">'+(isNew?"Nouvel appel":"#"+fmtNo(e.client)+" · demandé par "+esc(e.requester))+'</div><h3>'+(isNew?"Créer un appel":esc(e.town)+", "+esc(e.addr))+'</h3>'+(isNew?"":'<div class="m" style="margin-top:4px">'+esc(e.appliance)+'</div>')+'</div><button class="ibtn" id="x" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
 '<form class="dr-b" id="f">'+(DS.length?'<div class="dsug"><div class="lb"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>Meilleurs choix · 5 prochains jours</div>'+DS.map((x,i)=>{const tt=T[x.t],d=fromKey(x.k);return '<button type="button" class="sug'+(i===0?" best":"")+'" data-ds="'+i+'"><span class="av" style="--c:'+tt.c+'">'+tt.ini+'</span><div style="min-width:0"><b>'+esc(tt.name.split(" ")[0])+' · '+cap1(DAYS[d.getDay()].slice(0,3))+'. '+d.getDate()+', '+hfr(x.s)+'</b><span>'+esc(why(x,c))+'</span></div><i>Céduler</i></button>'}).join("")+'</div>':(!isNew&&backlog().includes(c)?'<div class="dsug"><div class="lb">Meilleurs choix · 5 prochains jours</div><div style="font-size:12.5px;color:var(--muted)">Aucun employé qualifié n\'a un bloc libre de '+dfr(c.dur)+' d\'ici 5 jours. Choisis une date plus loin ci-dessous.</div></div>':""))+
  '<div class="field"><label for="f-p">Problème / travaux</label><textarea class="in" id="f-p">'+esc(e.problem)+'</textarea></div>'+
  '<div class="row2"><div class="field"><label for="f-c"># client</label><input class="in" id="f-c" value="'+esc(e.client)+'"></div><div class="field"><label for="f-t">Ville</label><input class="in" id="f-t" value="'+esc(e.town)+'"></div></div>'+
  '<div class="field"><label for="f-a">Adresse des travaux</label><input class="in" id="f-a" value="'+esc(e.addr)+'"></div>'+
  '<div class="row2"><div class="field"><label for="f-ty">Type</label><select class="in" id="f-ty">'+Object.entries(TYPES).map(([k,t])=>'<option value="'+k+'"'+(k===e.type?" selected":"")+'>'+t.label+'</option>').join("")+'</select></div><div class="field"><label for="f-s">Statut</label><select class="in" id="f-s"><option value="note"'+(e.status==="note"?" selected":"")+'>Pris en note</option><option value="cedule"'+(e.status==="cedule"?" selected":"")+'>Cédulé</option><option value="complete"'+(e.status==="complete"?" selected":"")+'>Complété</option></select></div></div>'+
  '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="f-u"'+(e.urgent?" checked":"")+'> Urgent</label>'+
  '<div class="row2"><div class="field"><label for="f-d">Date</label><input class="in" type="date" id="f-d" value="'+e.date+'"></div><div class="field"><label for="f-st">Début</label><select class="in" id="f-st">'+opts.join("")+'</select></div></div>'+
  '<div class="field"><span class="fl">Technicien · heures libres ce jour-là</span><div class="techs" id="f-tc"></div></div>'+
  '<div class="field"><label for="f-du">Durée (minutes)</label><div style="display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center"><input class="in" type="number" min="15" step="15" id="f-du" value="'+e.dur+'"><div class="quick">'+[30,60,90,120,240,480].map(m=>'<button type="button" data-m="'+m+'">'+dfr(m)+'</button>').join("")+'</div></div></div>'+
  '<div class="calc" id="f-end"></div>'+
  '<div class="row2"><div class="field"><label for="f-r">Récurrence</label><select class="in" id="f-r"><option value="0">Aucune</option><option value="7">Chaque semaine</option><option value="14">Aux 2 semaines</option><option value="28">Aux 4 semaines</option></select></div><div class="field"><label for="f-rn">Nombre de fois</label><input class="in" type="number" id="f-rn" min="2" max="26" value="4" disabled></div></div>'+
  (past.length?'<div class="hist"><span class="fl">Historique du client</span>'+past.map(p=>'<div><span>'+fromKey(p.date).getDate()+" "+MONTHS[fromKey(p.date).getMonth()].slice(0,4)+'.</span>'+TYPES[p.type].label+'</div>').join("")+'</div>':"")+
 '</form><div class="dr-f">'+(isNew?"":'<button class="btn ghost" id="del">Annuler l\'appel</button>')+'<span class="grow"></span><button class="btn" id="cl">Fermer</button><button class="btn primary" id="sv">'+(isNew?"Créer":"Enregistrer")+'</button></div>';
 const drawT=()=>{const k=$("#f-d").value||e.date;const ty=$("#f-ty").value;$("#f-tc").innerHTML=TECHS.map(t=>{const s=techDay(t.id,k);return '<button type="button" class="tc'+(s.full?" abs":"")+(can(t.id,ty)?"":" nq")+'" data-t="'+t.id+'" aria-pressed="'+sel.has(t.id)+'"><span class="av" style="--c:'+t.c+'">'+t.ini+'</span>'+t.name.split(" ")[0]+' <small>'+(s.full?esc(s.full.reason):hrs(s.free))+'</small></button>'}).join("")};
 drawT();
 const up=()=>{const s=+$("#f-st").value,d=Math.max(15,+$("#f-du").value||0);$("#f-end").innerHTML='Fin calculée <b>'+hfr(s+d)+'</b>'+(s+d>DAY_END?'<span class="w">Dépasse 18 h</span>':"")};up();
 $("#f-st").onchange=up;$("#f-du").oninput=up;$("#f-d").onchange=drawT;$("#f-ty").onchange=drawT;
 $("#drawer").querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{$("#f-du").value=b.dataset.m;up()});
 $("#f-tc").onclick=ev=>{const b=ev.target.closest(".tc");if(!b)return;const id=b.dataset.t;sel.has(id)?sel.delete(id):sel.add(id);b.setAttribute("aria-pressed",sel.has(id))};
 $("#f-r").onchange=()=>{$("#f-rn").disabled=$("#f-r").value==="0"};
 $("#drawer").querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>{const x=DS[+b.dataset.ds];remember();c.techs=[x.t];c.date=x.k;c.start=x.s;c.status="cedule";closeDrawer();render();const d=fromKey(x.k);toast("Cédulé : "+T[x.t].name+", "+DAYS[d.getDay()]+" "+d.getDate()+" à "+hfr(x.s),true)});
 $("#x").onclick=$("#cl").onclick=closeDrawer;
 $("#sv").onclick=()=>save(sel);$("#f").onsubmit=ev=>{ev.preventDefault();save(sel)};
 if(!isNew)$("#del").onclick=()=>{remember();S.calls.splice(S.calls.findIndex(x=>x.id===e.id),1);closeDrawer();render();toast("Appel annulé",true)};
 $("#scrim").classList.add("on");$("#drawer").classList.add("on");
}
function save(sel){
 remember();const e=ed;e.problem=$("#f-p").value.trim();e.client=$("#f-c").value.trim()||"0";e.town=$("#f-t").value.trim()||"Ville à confirmer";e.addr=$("#f-a").value.trim();
 e.type=$("#f-ty").value;e.status=$("#f-s").value;e.urgent=$("#f-u").checked;e.techs=[...sel];e.date=$("#f-d").value||S.date;e.start=+$("#f-st").value;e.dur=Math.max(15,Math.round((+$("#f-du").value||60)/15)*15);
 if(e.techs.length&&e.status==="note")e.status="cedule";if(!e.techs.length&&e.status==="cedule")e.status="note";
 let msg;if(e.id){S.calls[S.calls.findIndex(x=>x.id===e.id)]=e;msg="Appel enregistré"}else{e.id=nid();S.calls.push(e);msg=e.techs.length?"Appel cédulé":"Ajouté à « À céduler »"}
 const step=+$("#f-r").value,n=+$("#f-rn").value;if(step&&n>1&&e.techs.length){for(let i=1;i<n;i++){const cp=JSON.parse(JSON.stringify(e));cp.id=nid();cp.date=addDays(e.date,step*i);cp.status="cedule";S.calls.push(cp)}msg+=", "+n+" occurrences"}
 closeDrawer();if(e.techs.length&&S.view!=="calls")S.date=e.date;render();toast(msg,true);
}
function closeDrawer(){$("#scrim").classList.remove("on");$("#drawer").classList.remove("on");ed=null}

/* Interface */
let tt;function toast(m,u){const t=$("#toast");t.innerHTML="<span>"+esc(m)+"</span>"+(u?'<button type="button" id="undo">Annuler<kbd>Ctrl Z</kbd></button>':"");t.classList.toggle("act",!!u);t.classList.add("on");if(u)$("#undo").onclick=undo;clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on","act"),u?6000:2400)}
function step(n){const v=S.view;if(v==="day"){let k=addDays(S.date,n);while(isWE(k))k=addDays(k,n);S.date=k}else if(v==="week")S.date=addDays(monday(S.date),7*n);else{const d=fromKey(S.date);S.date=key(new Date(d.getFullYear(),d.getMonth()+n,1))}render()}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);$("#today").onclick=()=>{S.date=TODAY;render()};
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(S.view==="calls")S.cmode=b.dataset.seg;else S.view=b.dataset.seg;render()};
$("#sum").onclick=e=>{const b=e.target.closest("[data-tf]");if(b){S.tf=b.dataset.tf;render();return}
 const m=e.target.closest("[data-wm]");if(m){S.wmode=m.dataset.wm;render();return}
 const w=e.target.closest("[data-wt]");if(w){const id=w.dataset.wt;if(id==="all")S.wt.clear();else if(S.wt.size===0)S.wt=new Set([id]);else{S.wt.has(id)?S.wt.delete(id):S.wt.add(id)}render()}};

$("#stage").addEventListener("click",e=>{const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();return}const tr=e.target.closest("tbody tr");if(tr)openDrawer(byId(tr.dataset.id))});


$("#n-team").onclick=()=>{S.view="team";closePop();render()};
$("#sum").addEventListener("click",e=>{const tm=e.target.closest("[data-tmf]");if(tm){S.tmf=tm.dataset.tmf;render();return}
 if(e.target.closest("[data-drv]")){S.drvOn=!S.drvOn;render();toast(S.drvOn?"Temps de route affiché entre les appels":"Temps de route masqué");return}
 const fb=e.target.closest("[data-fk]");if(fb){e.stopPropagation();if(POPK===fb.dataset.fk)closePop();else openPop(fb.dataset.fk);return}
 if(e.target.closest("[data-urg]")){S.f.urg=!S.f.urg;render();return}
 if(e.target.closest("[data-fclr]")){const F=S.f;["st","ty","te","tw","src"].forEach(k=>F[k].clear());F.urg=false;F.per="all";closePop();render()}});
$("#pop").addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("[data-po]");if(!b||!POPK)return;const k=POPK,id=b.dataset.po;
 if(k==="per"){S.f.per=id;render();closePop();return}S.f[k].has(id)?S.f[k].delete(id):S.f[k].add(id);render();openPop(k)});
document.addEventListener("click",e=>{if(POPK&&!e.target.closest("#pop"))closePop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&POPK)closePop()});
$("#stage").addEventListener("click",e=>{const em=e.target.closest("[data-emp]");if(em){openEmp(T[em.dataset.emp]);return}
 const sc=e.target.closest("[data-sched]");if(sc){e.stopPropagation();openDrawer(byId(sc.dataset.sched))}},true);
$("#tm").onclick=()=>{S.map=!S.map;render()};
$("#queue").addEventListener("click",e=>{const a=e.target.closest("[data-as]");if(a){assignSug(+a.dataset.as);return}
 if(e.target.closest("[data-open]")){openDrawer(byId(S.pick));return}if(e.target.closest("[data-unpick]")){pickCall(S.pick)}});
$("#stage").addEventListener("pointerdown",e=>{const g=e.target.closest(".sg");if(g){e.stopPropagation();e.preventDefault();assignSug(+g.dataset.sg)}},true);
$("#map").addEventListener("click",e=>{const o=e.target.closest("[data-opt]");if(o){optimize(o.dataset.opt,S.date);return}const b=e.target.closest("[data-pk]");if(b){S.queue=true;pickCall(b.dataset.pk)}});
$("#map").addEventListener("mouseover",e=>{const r=e.target.closest(".ml[data-tech],.tg");mapFocus(r?r.dataset.tech:null)});
$("#map").addEventListener("mouseleave",()=>mapFocus(null));
$("#stage").addEventListener("mouseover",e=>{if(!S.map)return;const r=e.target.closest(".row[data-tech]");mapFocus(r?r.dataset.tech:null)});
$("#stage").addEventListener("mouseleave",()=>{if(S.map)mapFocus(null)});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)&&UNDO){e.preventDefault();undo()}
 if(e.key==="Escape"&&S.pick&&!ed)pickCall(S.pick)});
$("#stage").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const el=e.target.closest(".job,.ev,.q");if(el)openDrawer(byId(el.dataset.id))});
$("#queue").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.target.closest("button")){const el=e.target.closest(".q");if(el)pickCall(el.dataset.id)}});
$("#tq").onclick=()=>{S.queue=!S.queue;render()};
$("#new").onclick=()=>S.view==="team"?openEmp(null):openDrawer(null);
$("#q").oninput=e=>{S.q=e.target.value.trim();render()};
$("#n-plan").onclick=()=>{if(S.view==="calls")S.view="day";render()};
$("#n-calls").onclick=()=>{S.view="calls";render()};
$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ed)closeDrawer();if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==="day"||S.view==="week")render()},120)});
if(isWE(S.date))S.date=addDays(monday(S.date),7);
render();
})();
